<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Cuts Barber Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,sans-serif;background:#f4f4f4}
.hidden{display:none!important}

/* HEADER */
header{
background:#111;color:#fff;
position:fixed;top:0;width:100%;z-index:1000
}
.header{
height:70px;display:flex;
align-items:center;justify-content:space-between;
padding:0 20px
}
header h1{color:#f5c542}

/* HERO */
#hero{
height:100vh;margin-top:70px;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url("https://as2.ftcdn.net/v2/jpg/08/52/39/93/1000_F_852399316_IagLQnnpNlPlypLFt31Wr37b7CAzP9pZ.jpg")
center/cover no-repeat;
display:flex;align-items:center;color:#fff;padding:20px
}
#hero h2{font-size:3rem}

/* BOOKING */
#booking{padding:80px 20px;background:#fff}
form{
max-width:600px;margin:auto;
display:grid;gap:15px
}
input,select,button{
padding:12px;border-radius:8px;
border:1px solid #ccc;font-size:1rem
}
button{
background:#111;color:#fff;
border:none;cursor:pointer
}
button:hover{background:#f5c542;color:#000}

/* STATUS */
#statusBox{
max-width:600px;margin:30px auto;padding:20px;
background:#fff3cd;color:#856404;
border-radius:10px;text-align:center;font-weight:600
}

/* STYLE VIEWER */
#styleScreen{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#000;z-index:3000;
display:flex;flex-direction:column;
align-items:center;justify-content:center
}
#styleImage{max-width:90%;max-height:70%;object-fit:contain}
.arrow{
position:absolute;top:50%;
transform:translateY(-50%);
font-size:50px;color:#fff;
cursor:pointer;padding:10px
}
.arrow.left{left:20px}
.arrow.right{right:20px}
.actions{margin-top:20px;display:flex;gap:25px}
.actions span{
font-size:30px;padding:16px 22px;
border-radius:50%;cursor:pointer;color:#fff
}
.select{background:#28a745}
.close{background:#dc3545}
</style>
</head>

<body>

<header>
  <div class="header">
    <h1>Elite Cuts</h1>
  </div>
</header>

<section id="hero">
  <div>
    <h2>Style That Defines You</h2>
    <p>Open 9:00 AM – 9:00 PM</p>
    <button onclick="booking.scrollIntoView({behavior:'smooth'})">
      Book Appointment
    </button>
  </div>
</section>

<section id="booking">
<h2 style="text-align:center;margin-bottom:30px">Book Appointment</h2>

<form onsubmit="bookAppointment(event)">

<input id="name" placeholder="Full Name" required>
<input id="phone" type="tel" placeholder="Phone (10 digits)"
maxlength="10" pattern="[0-9]{10}" required>

<select id="service" onchange="serviceChanged()" required>
<option value="">Select Service</option>
<option value="hair">Hair Cutting</option>
<option value="color">Hair Coloring</option>
<option value="beard">Beard Service</option>
<option value="facial">Facial</option>
</select>

<button type="button" id="chooseBtn" class="hidden" onclick="openViewer()">
Choose Style
</button>

<select id="barber">
<option value="">Any Barber (Optional)</option>
<option>Bijoy</option>
<option>Soyeb</option>
<option>Shubham</option>
</select>

<input id="date" type="date" required>
<input id="time" type="time">

<button type="submit">Confirm Booking</button>
</form>

<div id="statusBox" class="hidden">
⏳ Booking request sent.<br>
Your request is <b>pending approval</b>.
</div>
</section>

<!-- STYLE VIEWER -->
<div id="styleScreen" class="hidden">
<span class="arrow left" onclick="prevImage()">&#10094;</span>
<img id="styleImage">
<span class="arrow right" onclick="nextImage()">&#10095;</span>
<div class="actions">
  <span class="select" onclick="selectStyle()">✔</span>
  <span class="close" onclick="closeViewer()">✖</span>
</div>
</div>

<script>
const BARBERS={
Bijoy:"916289890040",
Soyeb:"918910261363",
Shubham:"918100510339",
Any:"916289890040"
};

const STYLES={
hair:[
"https://cdn.shopify.com/s/files/1/0029/0868/4397/files/low-taper-fade-hairstyle-boy.webp",
"https://cdn.shopify.com/s/files/1/0029/0868/4397/files/modern-mullet-hairstyle-boy.webp",
"https://cdn.shopify.com/s/files/1/0029/0868/4397/files/blowout-taper-haircut-boy.webp",
"https://cdn.shopify.com/s/files/1/0029/0868/4397/files/crew-cut-hairstyle.webp"
],
color:[
"https://www.stylenscissors.com/wp-content/uploads/2024/02/Platinum-Blonde-Hair-Colour-1024x512.jpg",
"https://www.stylenscissors.com/wp-content/uploads/2024/02/Ash-Gray-Hair-Colour-1024x512.jpg",
"https://www.stylenscissors.com/wp-content/uploads/2024/02/blonde-tones-hair-Colour-1024x512.jpg"
],
beard:[
"https://hollywoodyxe.com/wp-content/uploads/2025/08/The-Verdi-Beard.jpg",
"https://hollywoodyxe.com/wp-content/uploads/2025/08/Circle-Beard.jpg",
"https://hollywoodyxe.com/wp-content/uploads/2025/08/Balbo-Beard.jpg",
"https://hollywoodyxe.com/wp-content/uploads/2025/08/Trimmed-Beard.jpg"
]
};

let currentService="";
let currentIndex=0;
let selectedIndex=null;

function serviceChanged(){
currentService=service.value;
selectedIndex=null;
chooseBtn.textContent="Choose Style";
chooseBtn.classList.toggle("hidden",!STYLES[currentService]);
}

function openViewer(){
currentIndex = selectedIndex !== null ? selectedIndex : 0;
styleImage.src=STYLES[currentService][currentIndex];
styleScreen.classList.remove("hidden");
}
function closeViewer(){styleScreen.classList.add("hidden")}

function prevImage(){
const t=STYLES[currentService].length;
currentIndex=(currentIndex-1+t)%t;
styleImage.src=STYLES[currentService][currentIndex];
}
function nextImage(){
const t=STYLES[currentService].length;
currentIndex=(currentIndex+1)%t;
styleImage.src=STYLES[currentService][currentIndex];
}

function selectStyle(){
selectedIndex=currentIndex;   // ⭐ SAVE SELECTED IMAGE
chooseBtn.textContent="Change Style";
closeViewer();
}

function bookAppointment(e){
e.preventDefault();
const barberName=barber.value||"Any";
const msg=`New Booking Request 💈
Name: ${name.value}
Phone: ${phone.value}
Service: ${service.options[service.selectedIndex].text}
Selected Style: ${selectedIndex!==null ? "Style "+(selectedIndex+1) : "Not selected"}
Date: ${date.value}
Time: ${time.value||"Not selected"}

Please reply:
APPROVED - time
or
REJECTED`;

window.open(`https://wa.me/${BARBERS[barberName]}?text=${encodeURIComponent(msg)}`,"_blank");
statusBox.classList.remove("hidden");
e.target.reset();
chooseBtn.classList.add("hidden");
}
</script>

</body>
</html>
